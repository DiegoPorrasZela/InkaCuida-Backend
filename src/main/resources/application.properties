spring.application.name=inkacuida-api
server.port=${PORT:8080}

# Lee las variables desde un archivo .env en la carpeta del proyecto (si existe)
spring.config.import=optional:file:.env[.properties]

# ---------- Base de datos PostgreSQL (Neon) ----------
# DB_URL ejemplo: jdbc:postgresql://ep-xxxx-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inkacuida}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Hibernate crea/actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Seguridad ----------
app.jwt.secret=${JWT_SECRET:inkacuida-clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.horas-validez=168
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Crea la paciente demo (maria@inkacuida.pe / 123456) si no existe
app.seed-demo=${SEED_DEMO:true}
