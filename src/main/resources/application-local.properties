# Perfil "local": base H2 en memoria, para probar sin conexion a Neon.
# Ejecutar con:  mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:inkacuida;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
